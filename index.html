<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Recettes">
  <title>Mon livre de recettes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="entete">
    <h1>📖 Mon livre de recettes</h1>
    <p class="sous-titre">Toutes mes recettes, classées et faciles à retrouver</p>
  </header>

  <main>
    <div class="barre-outils">
      <input
        type="text"
        id="recherche"
        placeholder="Rechercher une recette..."
        aria-label="Rechercher une recette"
        list="suggestions-recherche"
        autocomplete="off"
      >
      <datalist id="suggestions-recherche"></datalist>
      <div id="filtres-categories" class="filtres-categories">
        <!-- Les boutons de catégories sont générés automatiquement par script.js -->
      </div>
      <div id="filtres-sous-categories" class="filtres-sous-categories" hidden>
        <!-- Les boutons de sous-catégories sont générés automatiquement par script.js -->
      </div>
    </div>

    <p id="message-vide" class="message-vide" hidden>Aucune recette ne correspond à ta recherche.</p>

    <div id="grille-recettes" class="grille-recettes">
      <!-- Les cartes de recettes sont générées automatiquement par script.js -->
    </div>
  </main>

  <div id="modale-apercu" class="modale" hidden>
    <div class="modale-contenu">
      <div class="modale-entete">
        <h2 id="modale-titre"></h2>
        <div class="modale-actions">
          <a id="modale-lien-drive" class="modale-lien-drive" href="#" target="_blank" rel="noopener noreferrer">Ouvrir dans Google Drive ↗</a>
          <button id="modale-fermer" class="modale-fermer" type="button" aria-label="Fermer l'aperçu">✕</button>
        </div>
      </div>
      <iframe id="modale-iframe" class="modale-iframe" title="Aperçu du PDF"></iframe>
    </div>
  </div>

  <footer>
    <p>Recettes hébergées sur Google Drive — ce site n'affiche qu'un catalogue de liens.</p>
  </footer>

  <script src="recettes.js"></script>
  <script src="script.js"></script>
</body>
</html>
